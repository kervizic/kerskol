# Vhost Nginx pour kerskol.fr (VPS OVH, hote partage avec kertec.fr).
#
# Deploiement :
#   sudo ln -s /opt/kerskol/deploy/nginx/kerskol.fr.conf /etc/nginx/sites-available/kerskol.fr.conf
#   sudo ln -s /etc/nginx/sites-available/kerskol.fr.conf /etc/nginx/sites-enabled/
#   (les zones limit_req_zone sont dans /etc/nginx/conf.d/kerskol-ratelimit.conf)
#   sudo nginx -t && sudo systemctl reload nginx
#
# Routage :
#   /auth/v1/  -> GoTrue     127.0.0.1:9997 (prefixe retire)
#   /rest/v1/  -> PostgREST  127.0.0.1:3001 (prefixe retire)
#   /          -> build Vite statique dans /opt/kerskol/frontend/dist (fallback SPA)
#
# NOTE nginx : dès qu'un bloc "location" declare un add_header, il REMPLACE
# tous les add_header herites du server{}. Les en-tetes de securite sont donc
# re-declares dans chaque location qui pose ses propres en-tetes.

# --- HTTP : ACME + redirection vers HTTPS -----------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name kerskol.fr www.kerskol.fr;

    # Challenge Let's Encrypt (certbot webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Redirection www -> apex (en HTTPS) -------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kerskol.fr;

    ssl_certificate     /etc/letsencrypt/live/kerskol.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kerskol.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://kerskol.fr$request_uri;
}

# --- HTTPS : site principal -------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kerskol.fr;

    # TLS (certbot)
    ssl_certificate     /etc/letsencrypt/live/kerskol.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kerskol.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers on;

    # Racine = build Vite statique
    root /opt/kerskol/frontend/dist;
    index index.html;

    # Logs dedies
    access_log /var/log/nginx/kerskol.access.log;
    error_log  /var/log/nginx/kerskol.error.log;

    # Taille de corps raisonnable (API JSON uniquement)
    client_max_body_size 1m;

    # --- En-tetes de securite (par defaut, herites par les locations sans add_header) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self' https://accounts.google.com; upgrade-insecure-requests" always;

    # --- gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ======================= API : authentification ========================
    location /auth/v1/ {
        limit_req zone=kerskol_auth burst=10 nodelay;

        proxy_pass http://127.0.0.1:9997/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ======================= API : REST (PostgREST) ========================
    location /rest/v1/ {
        limit_req zone=kerskol_general burst=30 nodelay;

        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ======================= Front statique (SPA/PWA) ======================

    # Service worker : jamais en cache (doit toujours etre revalide).
    location = /sw.js {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self' https://accounts.google.com; upgrade-insecure-requests" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # index.html : jamais en cache (point d'entree de la SPA).
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self' https://accounts.google.com; upgrade-insecure-requests" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Manifest PWA : revalidation legere.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Assets hashes (Vite genere des noms avec empreinte) : cache long immuable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # version.json : marqueur de version, JAMAIS en cache (compare a chaud par
    # le client pour declencher une mise a jour propre).
    location = /version.json {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self' https://accounts.google.com; upgrade-insecure-requests" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Theme : assets EMPREINTES (tokens.<hash>.css, app-version.<hash>.js,
    # Andika-*.<hash>.woff2). Le nom change avec le contenu -> cache long
    # immuable sans risque de servir de l'ancien. La documentation (OFL.txt,
    # README.md) est inerte : sa mise en cache n'a pas d'impact runtime.
    # ^~ pour passer devant la regex des dotfiles ci-dessous.
    location ^~ /theme/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self' https://accounts.google.com; upgrade-insecure-requests" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Blocage des dotfiles (hors challenge ACME deja gere en HTTP).
    location ~ /\. {
        deny all;
    }

    # Fallback SPA : toute route inconnue renvoie index.html.
    # $uri.html permet de servir les pages statiques sans extension
    # (ex. /confidentialite -> confidentialite.html), avant le fallback SPA.
    location / {
        limit_req zone=kerskol_general burst=30 nodelay;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
