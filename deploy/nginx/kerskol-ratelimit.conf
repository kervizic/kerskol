# Zones de limitation de debit pour kerskol.fr.
#
# IMPORTANT : les directives limit_req_zone doivent vivre dans le contexte
# http{} (et non dans un server{}). Sur le VPS, ce fichier se place dans
# /etc/nginx/conf.d/ (inclus automatiquement dans http{}), PAS dans
# sites-available/. Le vhost kerskol.fr.conf reference ces zones via limit_req.
#
#   sudo cp kerskol-ratelimit.conf /etc/nginx/conf.d/kerskol-ratelimit.conf
#
# Cle = adresse IP client ($binary_remote_addr, ~16 octets/entree).
# 10m ~= 160 000 IP suivies par zone.

# Trafic general (assets, pages, API REST) : genereux.
limit_req_zone $binary_remote_addr zone=kerskol_general:10m rate=30r/s;

# Endpoints d'authentification (/auth/v1/) : nettement plus strict pour limiter
# le bruteforce et l'abus du flux OAuth.
limit_req_zone $binary_remote_addr zone=kerskol_auth:10m rate=20r/m;
